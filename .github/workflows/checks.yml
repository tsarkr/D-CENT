name: Offline safety checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline Python checks
        run: |
          python -B -m pipeline check
          python -B -m unittest discover -s tests -v
      - name: Check PHP and JavaScript
        run: |
          for file in docent*.php includes/*.php; do php -l "$file"; done
          php -n tests/gemini_safety.php
          php tests/narrative_safety.php   # needs mbstring, so not -n
          node --check static/docent.js
      - name: Check HTML sanitization
        run: |
          npm --prefix "$RUNNER_TEMP/docent-tests" install --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/docent-tests/node_modules" node tests/rendering_safety.cjs
